[package]
name = "von-neumann-probe"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy_ecs = "0.15"
bevy_math = "0.15"
bevy_utils = "0.15"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
noise = "0.9"
uuid = { version = "1.0", features = ["v4", "serde"] }

glam = "0.29"
thiserror = "1.0"
log = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 3
lto = true

[profile.dev]
opt-level = 1
